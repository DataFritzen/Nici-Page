# Lädt das WordPress-Theme bei jedem Push auf main per SFTP zu IONOS hoch.
# Benötigte Repository-Secrets (GitHub → Settings → Secrets and variables → Actions):
#   SFTP_HOST      Server aus IONOS → Hosting → SFTP & SSH
#   SFTP_USER      SFTP-Benutzername aus dem IONOS-Kundenbereich
#   SFTP_PASSWORD  zugehöriges Passwort
#   SFTP_PATH      Zielordner des Themes, bei IONOS: /public/wp-content/themes/nicole-ried
name: Theme zu WordPress hochladen

on:
  push:
    branches: [main]
    paths: ['wordpress-theme/nicole-ried/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
    steps:
      - name: Abbrechen, solange die Zugangsdaten fehlen
        if: env.SFTP_HOST == ''
        run: echo "::warning::SFTP-Secrets sind noch nicht eingetragen – nichts hochgeladen."

      - uses: actions/checkout@v5
        if: env.SFTP_HOST != ''

      - name: lftp installieren
        if: env.SFTP_HOST != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Theme hochladen
        if: env.SFTP_HOST != ''
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          # Sicherung: Weil --delete im Zielordner aufräumt, darf nur der Theme-Ordner das Ziel sein
          case "$SFTP_PATH" in
            */themes/nicole-ried) ;;
            *) echo "::error::SFTP_PATH muss auf /themes/nicole-ried enden (ist: $SFTP_PATH)"; exit 1 ;;
          esac
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            mirror --reverse --delete --verbose wordpress-theme/nicole-ried $SFTP_PATH;
            bye"
