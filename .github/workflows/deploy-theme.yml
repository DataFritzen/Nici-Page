# Lädt das WordPress-Theme bei jedem Push auf main per SFTP zu IONOS hoch.
# Benötigte Repository-Secrets (GitHub → Settings → Secrets and variables → Actions):
#   SFTP_HOST      Server aus IONOS → Hosting → SFTP & SSH
#   SFTP_USER      SFTP-Benutzername aus dem IONOS-Kundenbereich
#   SFTP_PASSWORD  zugehöriges Passwort
# Der Theme-Ordner auf dem Server wird automatisch gesucht (ein Secret SFTP_PATH wird nicht mehr verwendet).
name: Theme zu WordPress hochladen

on:
  push:
    branches: [main]
    paths: ['wordpress-theme/nicole-ried/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
    steps:
      - name: Abbrechen, solange die Zugangsdaten fehlen
        if: env.SFTP_HOST == ''
        run: echo "::warning::SFTP-Secrets sind noch nicht eingetragen – nichts hochgeladen."

      - uses: actions/checkout@v5
        if: env.SFTP_HOST != ''

      - name: PHP-Dateien prüfen
        if: env.SFTP_HOST != ''
        run: find wordpress-theme/nicole-ried -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Fragenweg und Startseiten-Abfolge prüfen
        if: env.SFTP_HOST != ''
        run: node --test tests/orientierung.test.mjs tests/hero-intro.test.mjs

      - name: lftp installieren
        if: env.SFTP_HOST != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Theme-Ordner auf dem Server finden
        if: env.SFTP_HOST != ''
        run: |
          sftp() { lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; set net:max-retries 2; $1; bye"; }
          echo "Startordner des SFTP-Zugangs:"; sftp "pwd; cls -1" || true
          # Nur ein Ordner, der schon existiert und das Theme enthält, kommt als Ziel infrage.
          # Reihenfolge: Zugang beginnt in wp-content → in public → im Webspace-Stamm.
          for candidate in themes/nicole-ried wp-content/themes/nicole-ried public/wp-content/themes/nicole-ried; do
            if sftp "cls -1 $candidate/style.css" >/dev/null 2>&1; then
              echo "Theme-Ordner gefunden: $candidate"
              echo "THEME_DIR=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Kein bestehender Theme-Ordner nicole-ried gefunden – nichts hochgeladen."
          exit 1

      - name: Theme hochladen
        if: env.SFTP_HOST != ''
        run: |
          # Sicherung: Weil --delete im Zielordner aufräumt, darf nur der Theme-Ordner das Ziel sein
          case "$THEME_DIR" in
            themes/nicole-ried|*/themes/nicole-ried) ;;
            *) echo "::error::Unerwarteter Zielordner: $THEME_DIR"; exit 1 ;;
          esac
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            mirror --reverse --delete --verbose wordpress-theme/nicole-ried $THEME_DIR;
            bye"
